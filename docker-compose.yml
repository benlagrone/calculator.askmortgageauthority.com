services:
  calculators:
    container_name: calculators-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18010:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').getcode() == 200 else 1)",
        ]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
